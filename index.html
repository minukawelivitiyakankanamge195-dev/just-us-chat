<div class="app">
  <header>
    <div class="avatar">♡</div>

    <div>
      <h2>just us.</h2>
      <p>our private little chat 🖤</p>
    </div>

    <span class="online">● online</span>
  </header>

  <div id="messages">
    <div class="welcome">
      welcome to your chat ✨<br>
      Send a message to get started.
    </div>
  </div>

  <form id="chatForm">
    <label class="photo" title="Choose a photo">
      📷
      <input type="file" id="photo" accept="image/*" hidden>
    </label>

    <input
      id="message"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button type="submit">➤</button>
  </form>
</div>
